name: Determine Image Tags

on:
  workflow_call:
    inputs:
      registry:
        description: "The container registry to use. Defaults to 'ghcr.io'."
        default: ghcr.io
        type: string
      username:
        description: "Your registry username. Defaults to 'spuxx'."
        default: spuxx
        type: string
      image_name:
        description: "Optional image name prefix for the tag. If provided, creates tags like registry/username/repository:image_name-{tag}"
        required: false
        type: string
      github_repository:
        description: "The GitHub repository name for the image."
        default: ${{ github.event.repository.name }}
        type: string
      project_version:
        description: "The current version of the application or package."
        required: true
        type: string
      tag:
        description: |
          What pattern should be used to tag the image.
          - branch: Uses a combination of the branch name, timestamp and commit hash to tag the image.
          - version: Uses the version in package.json to tag the image.
        required: true
        type: string
      latest:
        description: "Whether the image should also be tagged as the latest image."
        default: false
        type: boolean
    outputs:
      tags:
        description: "The tags."
        value: ${{ jobs.determine_image_tags.outputs.tags }}

jobs:
  determine_image_tags:
    name: Determine image tags
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.determine_image_tags.outputs.tags }}
    steps:
    - name: Determine image tags
      id: determine_image_tags
      shell: bash
      run: |
        # Initialize tags array
        tags=()
        
        # Base repository path includes the repository name
        repo_path="${{ inputs.registry }}/${{ inputs.username }}/${{ inputs.github_repository }}"
        echo "Repository path: ${repo_path}"
        
        # Determine tag parts based on the tagging pattern
        if [[ "${{ inputs.tag }}" == "branch" ]]; then
          echo "Using tagging pattern 'branch'."
          tag_suffix="${GITHUB_REF##*/}-$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
        elif [[ "${{ inputs.tag }}" == "version" ]]; then
          echo "Using tagging pattern 'version'."
          tag_suffix="${{ inputs.project_version }}"
        else
          echo "Invalid tagging pattern: '${{ inputs.tag }}'"
          exit 1
        fi
        
        # Apply image_name prefix if provided
        if [[ -n "${{ inputs.image_name }}" ]]; then
          echo "Using image name prefix: ${{ inputs.image_name }}"
          tag_base="${{ inputs.image_name }}-${tag_suffix}"
        else
          echo "No image name prefix provided"
          tag_base="${tag_suffix}"
        fi
        
        # Add the main tag with proper format
        tags+=("${repo_path}:${tag_base}")
        
        # Add 'latest' tag if specified
        if [[ "${{ inputs.latest }}" == "true" ]]; then
            if [[ -n "${{ inputs.image_name }}" ]]; then
                tags+=("${repo_path}:${{ inputs.image_name }}-latest")
            else
                tags+=("${repo_path}:latest")
            fi
        fi

        # Join tags array into a comma-separated string
        tags_string=$(IFS=,; echo "${tags[*]}")

        # Set output for use in subsequent steps
        echo "tags=${tags_string}" >> $GITHUB_OUTPUT
        echo "Generated tags: ${tags_string}"
