name: Build a PNPM project and publish the docker image

on:
  workflow_call:
    inputs:
      path:
        description: "Path to the project folder. Defaults to the repository root folder."
        default: "."
        type: string
      registry:
        description: "The registry to use. Defaults to 'ghcr.io'."
        default: ghcr.io
        type: string
      username:
        description: "The username to log into the registry with. Defaults to 'spuxx'."
        default: spuxx
        type: string
      repository:
        description: "The repository on the registry to publish to. Defaults to the github repository name."
        default: ${{ github.event.repository.name }}
        type: string
      context:
        description: "The docker build context. Defaults to the repository root folder."
        default: "."
        type: string
      dockerfile:
        description: "Path to the Dockerfile. (default {context}/Dockerfile)"
        default: Dockerfile
        type: string
      tag:
        description: |
          What pattern should be used to tag the image.
            - branch: Uses a combination of the branch name, timestamp and commit hash to tag the image.
            - version: Uses the version in package.json to tag the image.
        required: true
        type: string
      latest:
        description: "Whether the image should also be tagged as the latest image."
        default: false
        type: boolean
    secrets:
      token:
        description: "The registry's access token."
        required: true

jobs:
  extract_project_info:
    uses: spuxx-dev/ci-cd/.github/workflows/misc_extract_project_info.yml@v5.0.0
    with:
      path: ${{ inputs.path }}

  determine_image_tags:
    uses: spuxx-dev/ci-cd/.github/workflows/docker_determine_image_tags.yml@v5.0.0
    needs:
      - extract_project_info
    with:
      dockerhub_username: ${{ inputs.username }}
      dockerhub_repository: ${{ inputs.repository }}
      project_version: ${{ needs.extract_project_info.outputs.version }}
      tag: ${{ inputs.tag }}
      latest: ${{ inputs.latest }}

  build_and_push_image:
    uses: spuxx-dev/ci-cd/.github/workflows/docker_build_and_push_image.yml@v5.0.0
    needs:
      - determine_image_tags
    with:
      image_names: ${{ needs.determine_image_tags.outputs.tags }}
      registry: ${{ inputs.registry }}
      username: ${{ inputs.username }}
      repository: ${{ inputs.repository }}
      context: ${{inputs.context}}
      dockerfile: ${{inputs.dockerfile}}
    secrets:
      token: ${{ secrets.token }}
