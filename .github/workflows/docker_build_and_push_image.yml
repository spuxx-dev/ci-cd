name: build_and_push_image

on:
  workflow_call:
    inputs:
      image_names:
        description: "The image name."
        type: string
        required: true
      registry:
        description: "The registry to use. Defaults to 'ghcr.io'."
        default: ghcr.io
        type: string
      username:
        description: "Your registry username. Defaults to the GitHub repository owner."
        default: ${{ github.repository_owner }}
        type: string
      repository:
        description: "The repository on the registry to publish to. Defaults to the github repository name."
        default: ${{ github.event.repository.name }}
        type: string
      context:
        description: "The docker build context. Defaults to the repository root folder."
        default: "."
        type: string
      dockerfile:
        description: "Path to the Dockerfile. (default {context}/Dockerfile)"
        default: Dockerfile
        type: string
    secrets:
      token:
        description: "The registry's access token."
        required: true

jobs:
  build_and_push_image:
    name: Build and push image to Dockerhub
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
        platforms: [linux/amd64, linux/arm64]
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: ${{ matrix.platforms }}

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ secrets.token }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        push: true
        registry: ${{ inputs.registry }}
        context: ${{ inputs.context }}
        file: ${{ inputs.context }}/${{ inputs.dockerfile }}
        tags: ${{ inputs.image_names }}
        platforms: ${{ matrix.platforms }}
        
    - name: Finish
      shell: bash
      run: |
        echo "Image ${{ inputs.image_tags }} successfully build and pushed to registry."
