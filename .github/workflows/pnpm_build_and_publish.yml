name: Build and publish package

on:
  workflow_call:
    inputs:
      PNPM_VERSION:
        description: 'The version of pnpm to use. Optional if packageManager is specified in package.json'
        type: string
        required: false
        default: ''
      PATH:
        description: "The path to the package's directory. Defaults to the project's root directory."
        type: string
        required: false
        default: '/'
      TAG:
        description: 'The tag under which to publish. Defaults to latest.'
        type: string
        required: false
        default: 'latest'
      BUILD_COMMAND:
        description: "The build command. By default, will build everything in the workspace."
        type: string
        required: false
        default: 'pnpm -r build'

jobs:
  build_and_publish:
    name: Build and publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.PNPM_VERSION }}

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm -r install --frozen-lockfile

    - name: Build
      run: ${{ inputs.BUILD_COMMAND }}

    - name: Publish to npm
      working-directory: ${{ inputs.PATH }}
      run: |
        echo "Publishing artifact."
        pnpm publish --no-git-checks --access public --tag ${{ inputs.TAG }}

